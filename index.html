<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">

  <title>Pickleball Scoreboard</title>

  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      padding: max(10px, env(safe-area-inset-top))
               max(10px, env(safe-area-inset-right))
               max(10px, env(safe-area-inset-bottom))
               max(10px, env(safe-area-inset-left));
    }

    .scoreboard {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .scores {
      display: flex;
      gap: 10px;
      height: 68vh;
      min-height: 400px;
    }

    .team {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }

    .team-a { background: #1267d6; }
    .team-b { background: #d62828; }

    .score {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: clamp(190px, 38vw, 510px);
      font-weight: 400;
      line-height: 1;
    }

    .server {
      position: absolute;
      right: 7%;
      bottom: 0.5%;
      color: white;
      font-size: clamp(100px, 16vw, 210px);
      font-weight: 700;
      min-width: 1em;
      text-align: right;
      cursor: pointer;
    }

    .edit-arrows {
      display: none;
      position: absolute;
      z-index: 5;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: white;
      pointer-events: auto;
    }

    .edit-mode .edit-arrows {
      display: flex;
    }

    .score-arrows {
      inset: 3% 0 3% 0;
      justify-content: space-between;
      pointer-events: none;
    }

    .score-arrows .edit-arrow {
      pointer-events: auto;
      align-self: center;
    }

    .server-arrows {
      right: 2%;
      bottom: 3%;
      height: 48%;
      justify-content: space-between;
    }

    .edit-arrow {
      border: 0;
      background: rgba(0,0,0,0.35);
      color: white;
      min-height: 52px;
      width: 72px;
      padding: 0;
      border-radius: 10px;
      font-size: 38px;
      line-height: 1;
    }

    .undo-icon {
      display: inline-block;
      transform: rotate(90deg);
    }

    .edit-icon-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 44px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-icon-button.active {
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }

    button {
      min-height: 80px;
      border: 0;
      border-radius: 12px;
      font-size: clamp(17px, 2.5vw, 30px);
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.99); }

    .new-game-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .new-game-button .three-x {
      font-size: 0.58em;
      font-weight: normal;
      margin-top: 5px;
    }

    .auto-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .auto-button {
      min-height: 80px;
      height: 80px;
      padding: 0 24px;
      font-size: clamp(17px, 2.5vw, 30px);
      border-radius: 12px;
    }

    .auto-button {
      width: 100%;
      min-width: 110px;
      max-width: 220px;
      color: white;
    }

    .auto-left {
      background: #1267d6;
      justify-self: start;
    }

    .auto-right {
      background: #d62828;
    }

    #leftAuto {
      justify-self: start;
    }

    #rightAuto {
      justify-self: end;
    }

    .undo-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 64px;
      font-weight: normal;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 700px) {
      body { padding: 8px; }
      .scores { gap: 6px; min-height: 280px; }
    }
  </style>
</head>

<body>
<div class="scoreboard">
  <div class="scores">
    <div id="leftPanel" class="team">
      <div id="leftScore" class="score"></div>
      <div id="leftServer" class="server"></div>
      <div class="edit-arrows score-arrows">
        <button class="edit-arrow" onclick="adjustVisibleScore('left', 1); event.stopPropagation();" aria-label="Increase left score">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleScore('left', -1); event.stopPropagation();" aria-label="Decrease left score">▼</button>
      </div>
      <div id="leftServerArrows" class="edit-arrows server-arrows">
        <button class="edit-arrow" onclick="adjustVisibleServer('left', 1); event.stopPropagation();" aria-label="Increase left server">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleServer('left', -1); event.stopPropagation();" aria-label="Decrease left server">▼</button>
      </div>
    </div>

    <div id="rightPanel" class="team">
      <div id="rightScore" class="score"></div>
      <div id="rightServer" class="server"></div>
      <div class="edit-arrows score-arrows">
        <button class="edit-arrow" onclick="adjustVisibleScore('right', 1); event.stopPropagation();" aria-label="Increase right score">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleScore('right', -1); event.stopPropagation();" aria-label="Decrease right score">▼</button>
      </div>
      <div id="rightServerArrows" class="edit-arrows server-arrows">
        <button class="edit-arrow" onclick="adjustVisibleServer('right', 1); event.stopPropagation();" aria-label="Increase right server">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleServer('right', -1); event.stopPropagation();" aria-label="Decrease right server">▼</button>
      </div>
    </div>
  </div>

  <div class="controls">
    <button onclick="point()">POINT</button>
    <button onclick="nextServer()">NEXT SERVER</button>
    <button onclick="sideOut()">SIDE OUT</button>
    <button onclick="switchSides()">SWITCH SIDES</button>
    <button class="new-game-button" onclick="newGamePress()"><span>NEW GAME</span><span class="three-x">Press 3x</span></button>
  </div>

  <div class="auto-controls">
    <button id="leftAuto" class="auto-button auto-left" onclick="autoRally('left')">AUTO</button>
    <button class="undo-button" onclick="undo()" aria-label="Undo" title="Undo"><span class="undo-icon">&#8630;</span></button>
    <button id="editButton" class="edit-icon-button" onclick="toggleEditMode()" aria-label="Edit scores and server" title="Edit">&#9998;</button>
    <button id="rightAuto" class="auto-button auto-right" onclick="autoRally('right')">AUTO</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'pickleballScoreboardStateV1';

const defaultState = {
  scoreA: 0,
  scoreB: 0,
  servingTeam: 'A',
  serverNumber: 2,
  leftTeam: 'B'
};

let state = loadState();
let previousState = null;
let editMode = false;
let newGamePressCount = 0;
let newGamePressTimer = null;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return structuredClone(defaultState);
    const parsed = JSON.parse(saved);
    return { ...defaultState, ...parsed };
  } catch (e) {
    return structuredClone(defaultState);
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function rememberState() {
  previousState = JSON.parse(JSON.stringify(state));
}

function render() {
  const leftTeam = state.leftTeam;
  const rightTeam = leftTeam === 'A' ? 'B' : 'A';

  renderTeam('leftPanel', 'leftScore', 'leftServer', leftTeam);
  renderTeam('rightPanel', 'rightScore', 'rightServer', rightTeam);

  const leftAuto = document.getElementById('leftAuto');
  const rightAuto = document.getElementById('rightAuto');
  leftAuto.className = 'auto-button ' + (leftTeam === 'A' ? 'auto-left' : 'auto-right');
  rightAuto.className = 'auto-button ' + (rightTeam === 'A' ? 'auto-left' : 'auto-right');

  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editButton').classList.toggle('active', editMode);

  const leftServerArrows = document.getElementById('leftServerArrows');
  const rightServerArrows = document.getElementById('rightServerArrows');
  leftServerArrows.style.visibility = state.servingTeam === leftTeam ? 'visible' : 'hidden';
  rightServerArrows.style.visibility = state.servingTeam === rightTeam ? 'visible' : 'hidden';
}

function renderTeam(panelId, scoreId, serverId, team) {
  const panel = document.getElementById(panelId);
  const score = document.getElementById(scoreId);
  const server = document.getElementById(serverId);

  panel.className = 'team ' + (team === 'A' ? 'team-a' : 'team-b');
  score.textContent = team === 'A' ? state.scoreA : state.scoreB;
  server.textContent = state.servingTeam === team ? state.serverNumber : '';

  panel.onclick = function(e) {
    if (!editMode) return;
    if (e.target.closest('.edit-arrow') || e.target.classList.contains('server')) return;
  };

  server.onclick = function(e) {
    e.stopPropagation();
  };
}


function announce(message) {
  if (!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(message);
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;
  window.speechSynthesis.speak(utterance);
}

function autoRally(side) {
  const leftTeam = state.leftTeam;
  const winningTeam = side === 'left'
    ? leftTeam
    : (leftTeam === 'A' ? 'B' : 'A');

  // Serving team won the rally: score a point and keep serving.
  if (winningTeam === state.servingTeam) {
    point();
    announce('Point');
    return;
  }

  // Receiving team won against server 1: advance to server 2.
  if (state.serverNumber === 1) {
    nextServer();
    announce('Next server');
    return;
  }

  // Receiving team won against server 2: side out.
  sideOut();
  announce('Side out');
}


function toggleEditMode() {
  editMode = !editMode;
  render();
}

function visibleTeam(side) {
  if (side === 'left') return state.leftTeam;
  return state.leftTeam === 'A' ? 'B' : 'A';
}

function adjustVisibleScore(side, delta) {
  if (!editMode) return;
  const team = visibleTeam(side);
  rememberState();

  if (team === 'A') {
    state.scoreA = Math.max(0, Math.min(99, state.scoreA + delta));
  } else {
    state.scoreB = Math.max(0, Math.min(99, state.scoreB + delta));
  }

  render();
  save();
}

function adjustVisibleServer(side, delta) {
  if (!editMode) return;
  const team = visibleTeam(side);
  if (team !== state.servingTeam) return;

  rememberState();
  state.serverNumber = delta > 0 ? 2 : 1;
  render();
  save();
}



function point() {
  rememberState();
  if (state.servingTeam === 'A') state.scoreA++;
  else state.scoreB++;
  render();
  save();
}

function nextServer() {
  if (state.serverNumber === 2) return;
  rememberState();
  state.serverNumber = 2;
  render();
  save();
}

function sideOut() {
  rememberState();
  state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
  state.serverNumber = 1;
  render();
  save();
}

function switchSides() {
  rememberState();
  state.leftTeam = state.leftTeam === 'A' ? 'B' : 'A';
  render();
  save();
}

function undo() {
  if (!previousState) return;
  const current = JSON.parse(JSON.stringify(state));
  state = previousState;
  previousState = current;
  render();
  save();
}

function newGamePress() {
  newGamePressCount++;

  if (newGamePressTimer) clearTimeout(newGamePressTimer);

  if (newGamePressCount >= 3) {
    newGamePressCount = 0;
    newGamePressTimer = null;
    resetGame();
    return;
  }

  // Require all three presses to occur within 3 seconds.
  newGamePressTimer = setTimeout(() => {
    newGamePressCount = 0;
    newGamePressTimer = null;
  }, 3000);
}

function resetGame() {
  rememberState();
  state = structuredClone(defaultState);
  editMode = false;
  render();
  save();
}

function editScore(team) {
  const current = team === 'A' ? state.scoreA : state.scoreB;
  const result = prompt('Enter score:', current);
  if (result === null) return;

  const newScore = parseInt(result, 10);
  if (isNaN(newScore) || newScore < 0 || newScore > 99) return;

  rememberState();
  if (team === 'A') state.scoreA = newScore;
  else state.scoreB = newScore;
  render();
  save();
}

function editServer() {
  rememberState();
  state.serverNumber = state.serverNumber === 1 ? 2 : 1;
  render();
  save();
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
