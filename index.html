<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#111111">

  <title>Pickleball Scoreboard</title>

  <link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #111;
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      overscroll-behavior: none;
      touch-action: manipulation;
    }

    body {
      padding: max(10px, env(safe-area-inset-top))
               max(10px, env(safe-area-inset-right))
               max(10px, env(safe-area-inset-bottom))
               max(10px, env(safe-area-inset-left));
    }

    .scoreboard {
      width: 100%;
      max-width: 1400px;
      margin: 0 auto;
    }

    .scores {
      display: flex;
      gap: 10px;
      height: calc(68vh + 40px);
      min-height: 440px;
      position: relative;
}

    .team {
      flex: 1;
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      cursor: pointer;
    }

    .team-a { background: #1267d6; }
    .team-b { background: #d62828; }

    .score {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: clamp(190px, 38vw, 510px);
      font-weight: 400;
      line-height: 1;
    }

    .server {
      position: absolute;
      right: 7%;
      bottom: 0.5%;
      color: white;
      font-size: clamp(100px, 16vw, 210px);
      font-weight: 700;
      min-width: 1em;
      text-align: right;
      cursor: pointer;
    }

    .edit-arrows {
      display: none;
      position: absolute;
      z-index: 5;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      color: white;
      pointer-events: auto;
    }

    .edit-mode .edit-arrows {
      display: flex;
    }

    .score-arrows {
      inset: 3% 0 3% 0;
      justify-content: space-between;
      pointer-events: none;
    }

    .score-arrows .edit-arrow {
      pointer-events: auto;
      align-self: center;
    }

    .server-arrows {
      right: 2%;
      bottom: 3%;
      height: 48%;
      justify-content: space-between;
    }

    .edit-arrow {
      border: 0;
      background: rgba(0,0,0,0.35);
      color: white;
      min-height: 52px;
      width: 72px;
      padding: 0;
      border-radius: 10px;
      font-size: 38px;
      line-height: 1;
    }

    .undo-icon {
      display: inline-block;
      transform: rotate(90deg);
    }

    .edit-icon-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 44px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .edit-icon-button.active {
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
    }

    .sound-icon-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 40px;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .sound-icon-button.muted {
      background: rgba(255,255,255,0.18);
      border-radius: 50%;
    }

    .speaker-svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .sound-icon-button .mute-line {
      display: none;
    }

    .sound-icon-button.muted .sound-wave {
      display: none;
    }

    .sound-icon-button.muted .mute-line {
      display: block;
    }

    .controls {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin-top: 14px;
      margin-bottom: 18px;
    }

    .controls button {
      min-height: 40px;
      height: 40px;
      padding: 0 8px;
      font-size: clamp(13px, 1.9vw, 22px);
    }

    button {
      min-height: 80px;
      border: 0;
      border-radius: 12px;
      font-size: clamp(17px, 2.5vw, 30px);
      font-weight: bold;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }

    button:active { transform: scale(0.99); }

    .new-game-button {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      line-height: 1.05;
    }

    .new-game-button .three-x {
      font-size: 0.58em;
      font-weight: normal;
      margin-top: 5px;
    }

    .auto-controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto auto auto auto minmax(0, 1fr);
      align-items: center;
      gap: 18px;
      width: 100%;
    }

    .auto-button {
      min-height: 80px;
      height: 80px;
      padding: 0 24px;
      font-size: clamp(17px, 2.5vw, 30px);
      border-radius: 12px;
    }

    .auto-button {
      width: 100%;
      min-width: 110px;
      max-width: 220px;
      color: white;
    }

    .auto-left {
      background: #1267d6;
      justify-self: start;
    }

    .auto-right {
      background: #d62828;
    }

    #leftAuto {
      justify-self: start;
    }

    #rightAuto {
      justify-self: end;
    }

    .undo-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      font-size: 64px;
      font-weight: normal;
      line-height: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    @media (max-width: 700px) {
      body { padding: 8px; }
      .scores { gap: 6px; min-height: 280px; }
    }
  
    .switch-sides-icon {
      position: absolute;
      top: 8px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 5;
      width: 108px;
      height: 108px;
      padding: 3px;
      border: 0;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .switch-sides-icon svg {
      width: 92px;
      height: 92px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.6;
      stroke-linecap: round;
      stroke-linejoin: round;
      pointer-events: none;
    }

    .new-game-icon-button {
      width: 80px;
      height: 80px;
      min-height: 80px;
      padding: 0;
      border: 0;
      background: transparent;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .new-game-svg {
      width: 42px;
      height: 42px;
      fill: none;
      stroke: currentColor;
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

  
    /* v2.21 control layout */
    .icon-controls {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 10px;
      height: 70px;
      margin-top: 2px;
    }
    .labeled-icon-button {
      position: relative;
      width: 72px !important;
      height: 58px !important;
      min-height: 58px !important;
      padding: 0 0 15px !important;
      border: 0 !important;
      background: transparent !important;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: visible;
    }
    .labeled-icon-button .undo-icon,
    .labeled-icon-button .edit-glyph {
      font-size: 38px;
      line-height: 1;
    }
    .labeled-icon-button .speaker-svg,
    .labeled-icon-button .new-game-svg {
      width: 38px;
      height: 38px;
    }
    .icon-label {
      position: absolute;
      left: 0; right: 0; bottom: 0;
      text-align: center;
      font-size: 10px;
      line-height: 1;
      font-weight: 500;
      color: rgba(255,255,255,.9);
      pointer-events: none;
    }
    .auto-controls {
      display: grid !important;
      grid-template-columns: 1fr 1fr !important;
      gap: 10px !important;
      align-items: center;
      width: 100%;
      height: 80px;
      margin-top: 10px;
    }
    .auto-button {
      width: 100% !important;
      max-width: none !important;
      min-width: 0 !important;
      height: 80px !important;
      min-height: 80px !important;
      justify-self: stretch !important;
      font-size: clamp(18px, 2.5vw, 30px) !important;
    }

  
    /* v2.22 sizing refinements */
    .auto-controls {
      display: flex !important;
      justify-content: space-between !important;
      gap: 0 !important;
      width: 100%;
    }

    .auto-button {
      width: 33.333% !important;
      max-width: 33.333% !important;
      flex: 0 0 33.333% !important;
    }

    #leftAuto {
      justify-self: auto !important;
      margin-left: 0 !important;
    }

    #rightAuto {
      justify-self: auto !important;
      margin-right: 0 !important;
    }

    .icon-controls {
      gap: 14px;
    }

    .labeled-icon-button {
      width: 80px !important;
      height: 64px !important;
      min-height: 64px !important;
      padding-bottom: 15px !important;
    }

    .labeled-icon-button .undo-icon,
    .labeled-icon-button .edit-glyph {
      font-size: 44px;
    }

    .labeled-icon-button .speaker-svg,
    .labeled-icon-button .new-game-svg {
      width: 44px;
      height: 44px;
    }

    .icon-label {
      font-size: 11px;
    }

  
    /* v2.25 edit-arrow positioning refinements */
    .score-arrows {
      inset: 11% 0 11% 0;
    }

    .server-arrows {
      right: 1.5%;
      bottom: 1%;
      height: 25%;
      justify-content: space-between;
    }

  </style>
</head>

<body>
<div class="scoreboard">
  <div class="scores">
    <div id="leftPanel" class="team">
      <div id="leftScore" class="score"></div>
      <div id="leftServer" class="server"></div>
      <div class="edit-arrows score-arrows">
        <button class="edit-arrow" onclick="adjustVisibleScore('left', 1); event.stopPropagation();" aria-label="Increase left score">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleScore('left', -1); event.stopPropagation();" aria-label="Decrease left score">▼</button>
      </div>
      <div id="leftServerArrows" class="edit-arrows server-arrows">
        <button class="edit-arrow" onclick="adjustVisibleServer('left', 1); event.stopPropagation();" aria-label="Increase left server">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleServer('left', -1); event.stopPropagation();" aria-label="Decrease left server">▼</button>
      </div>
    </div>
      <button id="switchSidesButton" class="switch-sides-icon" aria-label="Switch sides" title="Switch sides">
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <path d="M9 20a15 12 0 0 1 26-6"></path>
          <path d="M35 9v6h-6"></path>
          <path d="M39 28a15 12 0 0 1-26 6"></path>
          <path d="M13 39v-6h6"></path>
        </svg>
      </button>
<div id="rightPanel" class="team">
      <div id="rightScore" class="score"></div>
      <div id="rightServer" class="server"></div>
      <div class="edit-arrows score-arrows">
        <button class="edit-arrow" onclick="adjustVisibleScore('right', 1); event.stopPropagation();" aria-label="Increase right score">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleScore('right', -1); event.stopPropagation();" aria-label="Decrease right score">▼</button>
      </div>
      <div id="rightServerArrows" class="edit-arrows server-arrows">
        <button class="edit-arrow" onclick="adjustVisibleServer('right', 1); event.stopPropagation();" aria-label="Increase right server">▲</button>
        <button class="edit-arrow" onclick="adjustVisibleServer('right', -1); event.stopPropagation();" aria-label="Decrease right server">▼</button>
      </div>
    </div>
  </div>
  <div class="icon-controls">
    <button class="labeled-icon-button undo-button" onclick="undo()" aria-label="Undo" title="Undo">
      <span class="undo-icon">&#8630;</span><span class="icon-label">Undo</span>
    </button>
    <button id="soundButton" class="labeled-icon-button sound-icon-button" onclick="toggleSound()" aria-label="Turn sound off" title="Sound on">
      <svg class="speaker-svg" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M5 13h6l7-6v18l-7-6H5z"></path>
        <path class="sound-wave wave-1" d="M22 12c2 2 2 6 0 8"></path>
        <path class="sound-wave wave-2" d="M25 9c4 4 4 10 0 14"></path>
        <path class="mute-line" d="M22 12l7 8M29 12l-7 8"></path>
      </svg>
      <span class="icon-label">Sound</span>
    </button>
    <button id="editButton" class="labeled-icon-button edit-icon-button" onclick="toggleEditMode()" aria-label="Edit scores and server" title="Edit">
      <span class="edit-glyph">&#9998;</span><span class="icon-label">Edit</span>
    </button>
    <button class="labeled-icon-button new-game-icon-button" onclick="resetGame()" aria-label="Reset game" title="Reset">
      <svg class="new-game-svg" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M25 9v7h-7"></path>
        <path d="M25 16a10 10 0 1 0-2.9 7.1"></path>
      </svg>
      <span class="icon-label">Reset</span>
    </button>
  </div>

  <div class="auto-controls">
    <button id="leftAuto" class="auto-button auto-left" onclick="autoRally('left')">WINS RALLY</button>
    <button id="rightAuto" class="auto-button auto-right" onclick="autoRally('right')">WINS RALLY</button>
  </div>
</div>

<script>
const STORAGE_KEY = 'pickleballScoreboardStateV1';

const defaultState = {
  scoreA: 0,
  scoreB: 0,
  servingTeam: 'A',
  serverNumber: 2,
  leftTeam: 'B'
};

let state = loadState();
let previousState = null;
let editMode = false;
let scoreAnnouncementTimer = null;
let gameOver = false;
let soundEnabled = true;

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (!saved) return structuredClone(defaultState);
    const parsed = JSON.parse(saved);
    return { ...defaultState, ...parsed };
  } catch (e) {
    return structuredClone(defaultState);
  }
}

function save() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function rememberState() {
  previousState = JSON.parse(JSON.stringify(state));
}

function render() {
  const leftTeam = state.leftTeam;
  const rightTeam = leftTeam === 'A' ? 'B' : 'A';

  renderTeam('leftPanel', 'leftScore', 'leftServer', leftTeam);
  renderTeam('rightPanel', 'rightScore', 'rightServer', rightTeam);

  const leftAuto = document.getElementById('leftAuto');
  const rightAuto = document.getElementById('rightAuto');
  leftAuto.className = 'auto-button ' + (leftTeam === 'A' ? 'auto-left' : 'auto-right');
  rightAuto.className = 'auto-button ' + (rightTeam === 'A' ? 'auto-left' : 'auto-right');

  document.body.classList.toggle('edit-mode', editMode);
  document.getElementById('editButton').classList.toggle('active', editMode);

  const soundButton = document.getElementById('soundButton');
  soundButton.classList.toggle('muted', !soundEnabled);
  soundButton.setAttribute('aria-label', soundEnabled ? 'Turn sound off' : 'Turn sound on');
  soundButton.title = soundEnabled ? 'Sound on' : 'Sound off';

  const leftServerArrows = document.getElementById('leftServerArrows');
  const rightServerArrows = document.getElementById('rightServerArrows');
  leftServerArrows.style.visibility = state.servingTeam === leftTeam ? 'visible' : 'hidden';
  rightServerArrows.style.visibility = state.servingTeam === rightTeam ? 'visible' : 'hidden';
}

function renderTeam(panelId, scoreId, serverId, team) {
  const panel = document.getElementById(panelId);
  const score = document.getElementById(scoreId);
  const server = document.getElementById(serverId);

  panel.className = 'team ' + (team === 'A' ? 'team-a' : 'team-b');
  score.textContent = team === 'A' ? state.scoreA : state.scoreB;
  server.textContent = state.servingTeam === team ? state.serverNumber : '';

  panel.onclick = function(e) {
    if (!editMode) return;
    if (e.target.closest('.edit-arrow') || e.target.classList.contains('server')) return;
  };

  server.onclick = function(e) {
    e.stopPropagation();
  };
}


function announce(message, onEnd) {
  if (!soundEnabled || !('speechSynthesis' in window)) {
    if (onEnd) onEnd();
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(message);
  utterance.rate = 1;
  utterance.pitch = 1;
  utterance.volume = 1;

  if (onEnd) {
    utterance.onend = onEnd;
    utterance.onerror = onEnd;
  }

  window.speechSynthesis.speak(utterance);
}

function announceCurrentScoreAfterPause() {
  if (scoreAnnouncementTimer) {
    clearTimeout(scoreAnnouncementTimer);
  }

  scoreAnnouncementTimer = setTimeout(() => {
    const servingScore = state.servingTeam === 'A' ? state.scoreA : state.scoreB;
    const receivingScore = state.servingTeam === 'A' ? state.scoreB : state.scoreA;
    announce(`${servingScore}, ${receivingScore}, ${state.serverNumber}`);
    scoreAnnouncementTimer = null;
  }, 1000);
}

function announceFinalScoreAfterPause() {
  if (scoreAnnouncementTimer) {
    clearTimeout(scoreAnnouncementTimer);
  }

  scoreAnnouncementTimer = setTimeout(() => {
    const winningScore = state.servingTeam === 'A' ? state.scoreA : state.scoreB;
    const losingScore = state.servingTeam === 'A' ? state.scoreB : state.scoreA;
    announce(`${winningScore}, ${losingScore}`);
    scoreAnnouncementTimer = null;
  }, 1000);
}

function isGameWinningScore() {
  const servingScore = state.servingTeam === 'A' ? state.scoreA : state.scoreB;
  const receivingScore = state.servingTeam === 'A' ? state.scoreB : state.scoreA;
  return servingScore >= 11 && (servingScore - receivingScore) >= 2;
}

function autoRally(side) {
  if (gameOver) return;

  const leftTeam = state.leftTeam;
  const winningTeam = side === 'left'
    ? leftTeam
    : (leftTeam === 'A' ? 'B' : 'A');

  if (winningTeam === state.servingTeam) {
    point();
    return;
  }

  if (state.serverNumber === 1) {
    nextServer();
    return;
  }

  sideOut();
}


function toggleSound() {
  soundEnabled = !soundEnabled;

  if (!soundEnabled) {
    if (scoreAnnouncementTimer) {
      clearTimeout(scoreAnnouncementTimer);
      scoreAnnouncementTimer = null;
    }
    if ('speechSynthesis' in window) {
      window.speechSynthesis.cancel();
    }
  }

  render();
}

function toggleEditMode() {
  editMode = !editMode;
  render();
}

function visibleTeam(side) {
  if (side === 'left') return state.leftTeam;
  return state.leftTeam === 'A' ? 'B' : 'A';
}

function adjustVisibleScore(side, delta) {
  if (!editMode) return;
  const team = visibleTeam(side);
  rememberState();

  if (team === 'A') {
    state.scoreA = Math.max(0, Math.min(99, state.scoreA + delta));
  } else {
    state.scoreB = Math.max(0, Math.min(99, state.scoreB + delta));
  }

  render();
  save();
}

function adjustVisibleServer(side, delta) {
  if (!editMode) return;
  const team = visibleTeam(side);
  if (team !== state.servingTeam) return;

  rememberState();

  if (delta > 0) {
    // Increase server number: 1 -> 2. If already 2, leave it at 2.
    state.serverNumber = Math.min(2, state.serverNumber + 1);
  } else {
    if (state.serverNumber === 2) {
      // 2 -> 1 on the same serving team.
      state.serverNumber = 1;
    } else {
      // Going down from server 1 means a side out:
      // the other team becomes the serving team at server 1.
      state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
      state.serverNumber = 1;
    }
  }

  render();
  save();
}



function point() {
  if (gameOver) return;

  rememberState();
  if (state.servingTeam === 'A') state.scoreA++;
  else state.scoreB++;
  render();
  save();

  if (isGameWinningScore()) {
    gameOver = true;
    announce('Point. Game over.', announceFinalScoreAfterPause);
  } else {
    announce('Point', announceCurrentScoreAfterPause);
  }
}

function nextServer() {
  if (gameOver) return;
  if (state.serverNumber === 2) return;

  rememberState();
  state.serverNumber = 2;
  render();
  save();

  announce('Next server', announceCurrentScoreAfterPause);
}

function sideOut() {
  if (gameOver) return;

  rememberState();
  state.servingTeam = state.servingTeam === 'A' ? 'B' : 'A';
  state.serverNumber = 1;
  render();
  save();

  announce('Side out', announceCurrentScoreAfterPause);
}

function switchSides() {
  rememberState();
  state.leftTeam = state.leftTeam === 'A' ? 'B' : 'A';
  render();
  save();
}

// v3.1: respond on the initial iPad pointer press instead of waiting for click.
// preventDefault suppresses the follow-up synthetic click so one press = one switch.
const switchSidesButton = document.getElementById('switchSidesButton');
switchSidesButton.addEventListener('pointerdown', function(event) {
  event.preventDefault();
  switchSides();
});

function undo() {
  if (!previousState) return;
  const current = JSON.parse(JSON.stringify(state));
  state = previousState;
  previousState = current;
  gameOver = false;
  if (scoreAnnouncementTimer) {
    clearTimeout(scoreAnnouncementTimer);
    scoreAnnouncementTimer = null;
  }
  window.speechSynthesis?.cancel();
  render();
  save();
}

function resetGame() {
  if (scoreAnnouncementTimer) {
    clearTimeout(scoreAnnouncementTimer);
    scoreAnnouncementTimer = null;
  }

  if ('speechSynthesis' in window) {
    window.speechSynthesis.cancel();
  }

  state = { ...defaultState };
  previousState = null;
  editMode = false;
  gameOver = false;
  render();
  save();
}

function editScore(team) {
  const current = team === 'A' ? state.scoreA : state.scoreB;
  const result = prompt('Enter score:', current);
  if (result === null) return;

  const newScore = parseInt(result, 10);
  if (isNaN(newScore) || newScore < 0 || newScore > 99) return;

  rememberState();
  if (team === 'A') state.scoreA = newScore;
  else state.scoreB = newScore;
  render();
  save();
}

function editServer() {
  rememberState();
  state.serverNumber = state.serverNumber === 1 ? 2 : 1;
  render();
  save();
}

render();

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  });
}
